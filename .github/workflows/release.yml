name: Signed and notarized Mac release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies and verify source
        run: |
          npm ci
          npm run check
          npm test
          npm run prepare:runtime

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Prepare Apple notarization and sign bundled helpers
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          test -n "$APPLE_API_PRIVATE_KEY"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_SIGNING_IDENTITY"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" runtime/uv/uv
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" runtime/uv/uvx
          codesign --verify --strict --verbose=2 runtime/uv/uv
          codesign --verify --strict --verbose=2 runtime/uv/uvx

      - name: Build, notarize, staple, and sign updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Balto Speedrunner for Mac ${{ github.ref_name }}
          releaseBody: |
            Signed and Apple-notarized Balto Speedrunner for Apple Silicon.

            Open the DMG and double-click Balto. It installs into Applications, opens, and ejects the installer disk. First launch downloads the private runtime and optimized Qwen 3.8 27B model, then opens the coding workspace automatically.
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Gate release with Apple verification
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Balto Speedrunner.app"
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -d "$app"
          test -f "$dmg"
          xcrun stapler staple "$app"
          xcrun stapler staple "$dmg"
          scripts/verify-release.sh "$app" "$dmg"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          cp "$dmg" "$RUNNER_TEMP/Balto-Speedrunner-Mac-arm64.dmg"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Balto-Speedrunner-Mac-arm64.dmg" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
