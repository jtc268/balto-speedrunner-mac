<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Balto Speedrunner: 2x+ inference speed for Qwen 3.8 27B on Mac</title>
  <desc id="desc">A clean dark Balto banner with a large 2X+ inference speed claim.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111318"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="51%" r="48%">
      <stop stop-color="#ff6b35" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconSurface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="560" rx="34" fill="url(#background)"/>
  <rect width="1400" height="560" rx="34" fill="url(#glow)"/>
  <rect x="1" y="1" width="1398" height="558" rx="33" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <g transform="translate(524 50)">
    <rect width="64" height="64" rx="15" fill="url(#iconSurface)" stroke="#ffffff" stroke-opacity="0.7"/>
    <path fill="#ff6b35" d="M11 19 23 8l4 12c3-1 7-1 10 0L42 8l11 11-5 12c2 4 2 9 0 13-3 7-9 11-16 11S19 51 16 44c-2-4-2-9 0-13l-5-12Z"/>
    <path fill="#101114" d="M24 32c2-2 5-3 8-3s6 1 8 3l-2 12-6 5-6-5-2-12Z"/>
    <circle cx="23" cy="29" r="2.5" fill="#101114"/>
    <circle cx="41" cy="29" r="2.5" fill="#101114"/>
    <path fill="#ff6b35" d="M28 38h8l-4 4-4-4Z"/>
    <text x="82" y="27" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="850" letter-spacing="3">BALTO</text>
    <text x="82" y="54" fill="#969ca8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650" letter-spacing="5">SPEEDRUNNER</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="700" y="322" fill="#ff6b35" font-size="250" font-weight="900" letter-spacing="-14">2X+</text>
    <text x="700" y="390" fill="#ffffff" font-size="42" font-weight="850" letter-spacing="8">INFERENCE SPEED</text>
    <text x="700" y="448" fill="#ffffff" font-size="25" font-weight="760" letter-spacing="6">QWEN 3.8 27B ON MAC</text>
    <text x="700" y="493" fill="#a5aab5" font-size="19" font-weight="560">One-click local coding agent for Apple Silicon</text>
  </g>
</svg>
