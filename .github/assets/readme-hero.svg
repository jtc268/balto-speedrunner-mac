<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">Balto Speedrunner — triple Qwen 3.8 27B inference speed on Mac</title>
  <desc id="desc">A dark aurora product banner showing Balto Turbo D3 at 84.7 end-to-end tokens per second, 3.03 times the autoregressive baseline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07090F"/>
      <stop offset="0.52" stop-color="#0B0B15"/>
      <stop offset="1" stop-color="#050A0D"/>
    </linearGradient>
    <linearGradient id="aurora" x1="110" y1="90" x2="1210" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4F8B"/>
      <stop offset="0.34" stop-color="#9B5CFF"/>
      <stop offset="0.69" stop-color="#20C7FF"/>
      <stop offset="1" stop-color="#27E7A1"/>
    </linearGradient>
    <linearGradient id="bar1" x1="830" y1="0" x2="1260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8D55FF"/>
      <stop offset="0.55" stop-color="#24BFFF"/>
      <stop offset="1" stop-color="#27E7A1"/>
    </linearGradient>
    <radialGradient id="pinkGlow">
      <stop stop-color="#FF4F8B" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FF4F8B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop stop-color="#20C7FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#20C7FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000" flood-opacity="0.48"/>
    </filter>
    <clipPath id="cardClip"><rect x="764" y="102" width="546" height="476" rx="28"/></clipPath>
  </defs>

  <rect width="1400" height="680" rx="32" fill="url(#bg)"/>
  <rect width="1400" height="680" rx="32" fill="url(#grid)"/>
  <ellipse cx="132" cy="68" rx="390" ry="310" fill="url(#pinkGlow)"/>
  <ellipse cx="1278" cy="638" rx="470" ry="370" fill="url(#blueGlow)"/>
  <rect x="1" y="1" width="1398" height="678" rx="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(78 68)">
    <rect width="58" height="58" rx="17" fill="#10121B" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <path fill="url(#aurora)" d="M9 18 20 7l4 11c3-1 7-1 10 0L39 7l11 11-5 11c2 4 2 8 0 12-3 7-9 10-16 10S16 48 13 41c-2-4-2-8 0-12L9 18Z"/>
    <path fill="#171923" d="M21 29c2-2 5-3 8-3s6 1 8 3l-2 11-6 5-6-5-2-11Z"/>
    <circle cx="20" cy="27" r="2.2" fill="#090A0F"/>
    <circle cx="38" cy="27" r="2.2" fill="#090A0F"/>
    <path fill="#FF74B4" d="M25 35h8l-4 4-4-4Z"/>
    <text x="78" y="25" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="800" letter-spacing="3">BALTO</text>
    <text x="78" y="49" fill="#969AAA" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650" letter-spacing="5">SPEEDRUNNER</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="78" y="210" fill="url(#aurora)" font-size="70" font-weight="900" letter-spacing="-3">TRIPLE YOUR</text>
    <text x="78" y="282" fill="#FFFFFF" font-size="60" font-weight="850" letter-spacing="-2.5">QWEN 3.8 27B</text>
    <text x="78" y="352" fill="#FFFFFF" font-size="60" font-weight="850" letter-spacing="-2.5">INFERENCE SPEED</text>
    <text x="78" y="422" fill="#FFFFFF" font-size="60" font-weight="850" letter-spacing="-2.5">ON MAC.</text>

    <text x="82" y="472" fill="#A8ADBC" font-size="19" font-weight="500">One native app. MLX speed. Full coding agent.</text>
    <text x="82" y="503" fill="#A8ADBC" font-size="19" font-weight="500">Local, private, and built for Apple Silicon.</text>

    <g transform="translate(78 548)">
      <rect width="174" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <circle cx="25" cy="24" r="6" fill="#27E7A1" filter="url(#softGlow)"/>
      <text x="43" y="30" fill="#E9ECF3" font-size="15" font-weight="700">100% LOCAL</text>
      <rect x="188" width="181" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <circle cx="213" cy="24" r="6" fill="#20C7FF" filter="url(#softGlow)"/>
      <text x="231" y="30" fill="#E9ECF3" font-size="15" font-weight="700">FULL TOOL USE</text>
      <rect x="383" width="219" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <circle cx="408" cy="24" r="6" fill="#B66CFF" filter="url(#softGlow)"/>
      <text x="426" y="30" fill="#E9ECF3" font-size="15" font-weight="700">ONE-CLICK SETUP</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="764" y="102" width="546" height="476" rx="28" fill="#0E1119" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <g clip-path="url(#cardClip)">
      <ellipse cx="1270" cy="106" rx="240" ry="170" fill="url(#blueGlow)"/>
      <path d="M790 156H1284" stroke="#FFFFFF" stroke-opacity="0.08"/>
    </g>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="804" y="143" fill="#8F95A5" font-size="13" font-weight="750" letter-spacing="2.2">MEASURED END-TO-END SPEED</text>
    <text x="804" y="207" fill="#FFFFFF" font-size="48" font-weight="900" letter-spacing="-2">3.03×</text>
    <text x="948" y="202" fill="#8F95A5" font-size="16" font-weight="600">FASTER THAN BASELINE</text>
    <text x="948" y="224" fill="#666C7C" font-size="13">warm generation • M5 Max</text>

    <text x="804" y="284" fill="#7E8493" font-size="14" font-weight="650">AUTOREGRESSIVE</text>
    <rect x="804" y="300" width="426" height="15" rx="7.5" fill="#FFFFFF" fill-opacity="0.055"/>
    <rect x="804" y="300" width="140" height="15" rx="7.5" fill="#555B6A"/>
    <text x="1246" y="313" fill="#969CAA" font-size="15" font-weight="700">27.9</text>

    <text x="804" y="352" fill="#7E8493" font-size="14" font-weight="650">TURBO D1</text>
    <rect x="804" y="368" width="426" height="15" rx="7.5" fill="#FFFFFF" fill-opacity="0.055"/>
    <rect x="804" y="368" width="258" height="15" rx="7.5" fill="url(#bar1)" fill-opacity="0.66"/>
    <text x="1246" y="381" fill="#B9BFCD" font-size="15" font-weight="700">51.3</text>

    <text x="804" y="420" fill="#7E8493" font-size="14" font-weight="650">TURBO D2</text>
    <rect x="804" y="436" width="426" height="15" rx="7.5" fill="#FFFFFF" fill-opacity="0.055"/>
    <rect x="804" y="436" width="374" height="15" rx="7.5" fill="url(#bar1)" fill-opacity="0.82"/>
    <text x="1246" y="449" fill="#D2D7E0" font-size="15" font-weight="700">74.4</text>

    <text x="804" y="488" fill="#C7CDDA" font-size="14" font-weight="800">BALTO TURBO D3</text>
    <rect x="804" y="504" width="426" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.055"/>
    <rect x="804" y="504" width="426" height="18" rx="9" fill="url(#bar1)" filter="url(#softGlow)"/>
    <text x="1246" y="519" fill="#FFFFFF" font-size="16" font-weight="850">84.7</text>

    <text x="804" y="555" fill="#646B7A" font-size="12" font-weight="600">TOKENS / SECOND  •  QWEN 3.8 27B 4-BIT</text>
  </g>
</svg>
