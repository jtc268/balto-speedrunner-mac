agent-default-model:
  provider: balto
  model: balto-qwen-3.8-27b
  reasoningEffort: medium

permission:
  defaultPreset: danger-full-access

llm-pi-ai:
  providers:
    balto:
      displayName: Balto Local
      api: openai-completions
      baseURL: http://127.0.0.1:30100/v1
      headers:
        Authorization: Bearer local-balto
      defaultContextWindow: 262144
      defaultMaxTokens: 32768
      defaultInput:
        - text
        - image
      retryPolicy:
        mode: normal
        maxRetries: 5
        retryableCodes:
          - EMPTY_RESPONSE
          - RATE_LIMIT
          - SERVER
          - TIMEOUT
          - TRANSPORT
        backoff:
          initialDelayMs: 500
          maxDelayMs: 5000
          jitterRatio: 0.1
      models:
        - id: balto-qwen-3.8-27b
          name: Qwen 3.8 27B - Optimized Speed
          contextWindow: 262144
          maxTokens: 32768
          input:
            - text
            - image
          reasoningEfforts:
            off: none
            low: low
            medium: medium
            high: xhigh
          compat:
            thinkingFormat: deepseek
            supportsReasoningEffort: true
